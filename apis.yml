name: Pop-Up Magazine
description: >-
  Pop-Up Magazine is a live magazine created for a stage, a screen, and a live audience, produced by
  the team behind The California Sunday Magazine. Each production combines original nonfiction
  storytelling, live music, illustration, animation, and photography performed on tour in theaters
  across the United States. The company also operates Pop-Up Magazine Brand Studio, producing custom
  live and multimedia storytelling for brand partners. It was surfaced as a portfolio company of
  Slow Ventures and added to the API Evangelist network. Pop-Up Magazine is a consumer media and
  live-events brand; it publishes a public promotional website but exposes no developer program,
  public API, SDKs, or machine-readable API surface, so this profile is identity- and
  security-posture-only.
